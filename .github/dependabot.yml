version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # sha2 0.11 requires rustc 1.88. The crate MSRV is 1.86.
      - dependency-name: sha2
        versions: [">=0.11"]
      # Pinned to the qualified llama.cpp revision. Update it by hand after
      # the models pass qualification on the new revision.
      - dependency-name: llama-cpp-2
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
