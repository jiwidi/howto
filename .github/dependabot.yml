version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The crate MSRV is 1.86. sha2 0.11 requires rustc 1.88.
      - dependency-name: sha2
        versions: [">=0.11"]
      # tree-sitter 0.27 and tree-sitter-language 0.1.8 require rustc 1.90.
      - dependency-name: tree-sitter
        versions: [">=0.27"]
      - dependency-name: tree-sitter-language
        versions: [">=0.1.8"]
      # Pinned to the qualified llama.cpp revision. Update it by hand after
      # the models pass qualification on the new revision.
      - dependency-name: llama-cpp-2
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
