name: Publish Homebrew bottles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to bottle (for example v0.3.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: homebrew-bottles-${{ inputs.tag }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  TAP_REPOSITORY: jiwidi/homebrew-tap
  TAP_NAME: jiwidi/tap

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Validate release and tap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    outputs:
      already_published: ${{ steps.validate.outputs.already_published }}
      bottle_root_url: ${{ steps.validate.outputs.bottle_root_url }}
      tap_sha: ${{ steps.validate.outputs.tap_sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Require tap write credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Validate immutable release and current tap formula
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bottles are published only for stable semantic-version tags: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)"
          if [[ "$(jq -r .tagName <<<"$release_json")" != "$RELEASE_TAG" ]] || \
             [[ "$(jq -r .isDraft <<<"$release_json")" != false ]] || \
             [[ "$(jq -r .isPrerelease <<<"$release_json")" != false ]]; then
            echo "release must exist and be a published, non-prerelease release" >&2
            exit 1
          fi

          source_asset="howto-${version}-source.tar.gz"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$source_asset" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP"
          expected_source_sha="$(
            awk -v asset="$source_asset" '$2 == "*" asset { print $1 }' \
              "$RUNNER_TEMP/SHA256SUMS"
          )"
          actual_source_sha="$(sha256sum "$RUNNER_TEMP/$source_asset" | awk '{ print $1 }')"
          if [[ ! "$expected_source_sha" =~ ^[0-9a-f]{64}$ ]] || \
             [[ "$actual_source_sha" != "$expected_source_sha" ]]; then
            echo "source release checksum verification failed" >&2
            exit 1
          fi
          gh attestation verify "$RUNNER_TEMP/$source_asset" --repo "$GITHUB_REPOSITORY"

          tap_path="$RUNNER_TEMP/homebrew-tap"
          git clone --depth=1 "https://github.com/${TAP_REPOSITORY}.git" "$tap_path"
          tap_sha="$(git -C "$tap_path" rev-parse HEAD)"
          formula="$tap_path/Formula/howto.rb"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${source_asset}"
          bottle_root_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          grep -Fqx "  url \"$source_url\"" "$formula"
          grep -Fqx "  sha256 \"$actual_source_sha\"" "$formula"

          if ! grep -Fqx "  bottle do" "$formula"; then
            already_published=false
          else
            bottle_block="$(
              awk '
                /^  bottle do$/ { inside = 1 }
                inside { print }
                inside && /^  end$/ { exit }
              ' "$formula"
            )"
            if ! grep -Fq "root_url \"$bottle_root_url\"" <<<"$bottle_block"; then
              echo "tap formula already has a bottle block for a different root URL" >&2
              exit 1
            fi

            asset_names="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            verify_dir="$RUNNER_TEMP/existing-bottles"
            mkdir -p "$verify_dir"
            for bottle_tag in arm64_tahoe tahoe arm64_linux x86_64_linux; do
              expected_bottle_sha="$(
                sed -nE \
                  "s/.*[[:space:],]${bottle_tag}: \"([0-9a-f]{64})\".*/\\1/p" \
                  <<<"$bottle_block"
              )"
              if [[ ! "$expected_bottle_sha" =~ ^[0-9a-f]{64}$ ]]; then
                echo "tap bottle block is incomplete for $bottle_tag" >&2
                exit 1
              fi

              matching_assets=()
              while IFS= read -r asset_name; do
                case "$asset_name" in
                  "howto--${version}"*."${bottle_tag}".bottle.tar.gz)
                    matching_assets+=("$asset_name")
                    ;;
                esac
              done <<<"$asset_names"
              if [[ "${#matching_assets[@]}" -ne 1 ]]; then
                echo "release must contain exactly one $bottle_tag bottle" >&2
                exit 1
              fi

              asset_name="${matching_assets[0]}"
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir "$verify_dir"
              actual_bottle_sha="$(sha256sum "$verify_dir/$asset_name" | awk '{ print $1 }')"
              if [[ "$actual_bottle_sha" != "$expected_bottle_sha" ]]; then
                echo "published $bottle_tag bottle does not match the tap checksum" >&2
                exit 1
              fi
            done
            already_published=true
          fi

          {
            echo "already_published=$already_published"
            echo "bottle_root_url=$bottle_root_url"
            echo "tap_sha=$tap_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build bottle (${{ matrix.bottle_tag }})
    needs: preflight
    if: needs.preflight.outputs.already_published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            bottle_tag: arm64_tahoe
          - runner: macos-26-intel
            bottle_tag: tahoe
          - runner: ubuntu-22.04-arm
            bottle_tag: arm64_linux
          - runner: ubuntu-22.04
            bottle_tag: x86_64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true
          token: ${{ github.token }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: bottles-${{ matrix.runner }}-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: bottles-${{ matrix.runner }}-rubygems-

      - name: Check out the exact tap formula
        env:
          TAP_SHA: ${{ needs.preflight.outputs.tap_sha }}
        run: |
          set -euo pipefail
          brew tap "$TAP_NAME" "https://github.com/${TAP_REPOSITORY}.git"
          tap_path="$(brew --repository "$TAP_NAME")"
          git -C "$tap_path" fetch origin "$TAP_SHA"
          git -C "$tap_path" checkout --detach "$TAP_SHA"
          test "$(git -C "$tap_path" rev-parse HEAD)" = "$TAP_SHA"
          if grep -Fqx "  bottle do" "$tap_path/Formula/howto.rb"; then
            echo "refusing to rebuild a formula that already has bottles" >&2
            exit 1
          fi

      - name: Build, bottle, and test from the stable source
        env:
          BOTTLE_ROOT_URL: ${{ needs.preflight.outputs.bottle_root_url }}
          EXPECTED_BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          set -euo pipefail
          formula="$TAP_NAME/howto"
          if brew list --formula howto >/dev/null 2>&1; then
            brew uninstall --force howto
          fi

          brew install --build-bottle "$formula"
          brew test "$formula"
          brew linkage --test "$formula"

          bottle_dir="$RUNNER_TEMP/bottles"
          mkdir -p "$bottle_dir"
          cd "$bottle_dir"
          brew bottle --json --root-url="$BOTTLE_ROOT_URL" "$formula"

          shopt -s nullglob
          bottle_files=(*.bottle.tar.gz)
          bottle_json=(*.bottle.json)
          if [[ "${#bottle_files[@]}" -ne 1 || "${#bottle_json[@]}" -ne 1 ]]; then
            echo "expected exactly one bottle and one bottle JSON file" >&2
            exit 1
          fi
          actual_tags="$(jq -r '.[].bottle.tags | keys[]' "${bottle_json[0]}")"
          if [[ "$actual_tags" != "$EXPECTED_BOTTLE_TAG" ]]; then
            echo "expected bottle tag $EXPECTED_BOTTLE_TAG, got $actual_tags" >&2
            exit 1
          fi
          jq -e --arg root "$BOTTLE_ROOT_URL" \
            'all(.[]; .bottle.root_url == $root)' "${bottle_json[0]}" >/dev/null

          brew uninstall --force "$formula"
          brew install --force-bottle "$bottle_dir/${bottle_files[0]}"
          brew test "$formula"
          brew linkage --test "$formula"

          installed_prefix="$(brew --prefix "$formula")"
          executable_count="$(
            find "$installed_prefix" -type f -perm -0111 | wc -l | tr -d ' '
          )"
          if [[ "$executable_count" -ne 1 ]] || \
             [[ ! -x "$installed_prefix/bin/howto" ]]; then
            echo "bottle must install one executable: bin/howto" >&2
            exit 1
          fi

      - name: Upload bottle build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-bottle-${{ matrix.bottle_tag }}
          path: |
            ${{ runner.temp }}/bottles/*.bottle.json
            ${{ runner.temp }}/bottles/*.bottle.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish bottles and update tap
    needs:
      - preflight
      - build
    if: needs.preflight.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          stable: true
          token: ${{ github.token }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: bottles-publish-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: bottles-publish-rubygems-

      - name: Download all bottle build results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: homebrew-bottle-*
          path: bottles
          merge-multiple: true

      - name: Merge bottle metadata into the exact tap formula
        env:
          BOTTLE_ROOT_URL: ${{ needs.preflight.outputs.bottle_root_url }}
          TAP_SHA: ${{ needs.preflight.outputs.tap_sha }}
        run: |
          set -euo pipefail
          bottle_dir="$GITHUB_WORKSPACE/bottles"
          mapfile -t bottle_files < <(find "$bottle_dir" -maxdepth 1 -type f -name '*.bottle.tar.gz' | sort)
          mapfile -t bottle_json < <(find "$bottle_dir" -maxdepth 1 -type f -name '*.bottle.json' | sort)
          if [[ "${#bottle_files[@]}" -ne 4 || "${#bottle_json[@]}" -ne 4 ]]; then
            echo "expected four platform bottles and four metadata files" >&2
            exit 1
          fi

          actual_tags="$(
            jq -r '.[].bottle.tags | keys[]' "${bottle_json[@]}" | sort -u
          )"
          expected_tags="$(printf '%s\n' arm64_linux arm64_tahoe tahoe x86_64_linux)"
          if [[ "$actual_tags" != "$expected_tags" ]]; then
            echo "unexpected bottle tag set:" >&2
            printf '%s\n' "$actual_tags" >&2
            exit 1
          fi
          jq -e --arg root "$BOTTLE_ROOT_URL" \
            'all(.[]; .bottle.root_url == $root)' "${bottle_json[@]}" >/dev/null

          brew tap "$TAP_NAME" "https://github.com/${TAP_REPOSITORY}.git"
          tap_path="$(brew --repository "$TAP_NAME")"
          git -C "$tap_path" fetch origin main
          remote_sha="$(git -C "$tap_path" rev-parse origin/main)"
          if [[ "$remote_sha" != "$TAP_SHA" ]]; then
            echo "tap main changed after preflight; rerun against the new head" >&2
            exit 1
          fi
          git -C "$tap_path" checkout --detach "$TAP_SHA"
          formula_path="$tap_path/Formula/howto.rb"
          if grep -Fqx "  bottle do" "$formula_path"; then
            echo "tap formula gained a bottle block after preflight" >&2
            exit 1
          fi

          cd "$bottle_dir"
          brew bottle --merge --write --no-commit "${bottle_json[@]}"

          grep -Fq "root_url \"$BOTTLE_ROOT_URL\"" "$formula_path"
          for bottle_tag in arm64_tahoe tahoe arm64_linux x86_64_linux; do
            grep -Eq "[[:space:],]${bottle_tag}: \"[0-9a-f]{64}\"" "$formula_path"
          done

          mapfile -t merged_json < <(find "$bottle_dir" -maxdepth 1 -type f -name '*.bottle.json' | sort)
          while IFS=$'\t' read -r local_filename expected_sha; do
            test -f "$bottle_dir/$local_filename"
            actual_sha="$(sha256sum "$bottle_dir/$local_filename" | awk '{ print $1 }')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "bottle checksum changed during metadata merge: $local_filename" >&2
              exit 1
            fi
          done < <(
            jq -r '.[] | .bottle.tags[] | [.local_filename, .sha256] | @tsv' \
              "${merged_json[@]}"
          )

          changed_files="$(git -C "$tap_path" diff --name-only)"
          if [[ "$changed_files" != Formula/howto.rb ]]; then
            echo "bottle merge must change only Formula/howto.rb" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi
          git -C "$tap_path" diff --check
          brew style "$TAP_NAME/howto"
          brew audit --strict --formula "$TAP_NAME/howto"

      - name: Attest Homebrew bottles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bottles/*.bottle.tar.gz

      - name: Upload immutable bottle assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          existing_names="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"
          verification_dir="$RUNNER_TEMP/existing-bottle-assets"
          mkdir -p "$verification_dir"

          shopt -s nullglob
          bottle_files=("$GITHUB_WORKSPACE"/bottles/*.bottle.tar.gz)
          if [[ "${#bottle_files[@]}" -ne 4 ]]; then
            echo "refusing to publish an incomplete bottle set" >&2
            exit 1
          fi
          for bottle_file in "${bottle_files[@]}"; do
            asset_name="${bottle_file##*/}"
            if grep -Fxq "$asset_name" <<<"$existing_names"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir "$verification_dir"
              if ! cmp --silent "$bottle_file" "$verification_dir/$asset_name"; then
                echo "published bottle differs and will not be replaced: $asset_name" >&2
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$bottle_file" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Verify uploaded Linux bottle
        run: |
          set -euo pipefail
          brew fetch --force-bottle "$TAP_NAME/howto"

      - name: Commit only the bottle block to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_SHA: ${{ needs.preflight.outputs.tap_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured" >&2
            exit 1
          fi

          tap_path="$(brew --repository "$TAP_NAME")"
          git -C "$tap_path" fetch origin main
          if [[ "$(git -C "$tap_path" rev-parse origin/main)" != "$TAP_SHA" ]]; then
            echo "tap main changed while bottles were publishing; rerun safely" >&2
            exit 1
          fi

          git -C "$tap_path" add Formula/howto.rb
          staged_files="$(git -C "$tap_path" diff --cached --name-only)"
          if [[ "$staged_files" != Formula/howto.rb ]]; then
            echo "refusing to commit files other than Formula/howto.rb" >&2
            printf '%s\n' "$staged_files" >&2
            exit 1
          fi
          git -C "$tap_path" config user.name "howto-release[bot]"
          git -C "$tap_path" config user.email \
            "howto-release[bot]@users.noreply.github.com"
          git -C "$tap_path" commit -m "howto ${VERSION} bottles"

          gh auth setup-git
          git -C "$tap_path" push origin HEAD:main
