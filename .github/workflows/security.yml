name: Security audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisory scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main 2026-03-20, Node 24
        with:
          token: ${{ github.token }}
